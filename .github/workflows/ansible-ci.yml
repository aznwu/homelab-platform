---
name: ansible-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: yamllint + ansible-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint --strict .

      - name: ansible-lint
        run: ansible-lint

      - name: Playbook syntax check
        run: ansible-playbook --syntax-check playbooks/site.yml
        env:
          ANSIBLE_BECOME_ASK_PASS: "False"

  molecule:
    name: molecule (Rocky 9)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: Run molecule test
        run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
