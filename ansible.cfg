[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True
callback_result_format = yaml
forks = 10

[privilege_escalation]
become = True
become_method = sudo
# Prompt for the sudo password on every run (keeps passwordless sudo off the nodes).
# CI overrides this with ANSIBLE_BECOME_ASK_PASS=False.
become_ask_pass = True

[ssh_connection]
pipelining = True
