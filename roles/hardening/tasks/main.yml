---
# Safety net: never write an AllowUsers line that would lock out the account Ansible uses.
- name: Make sure the connecting user stays allowed over SSH
  ansible.builtin.assert:
    that:
      - (ansible_user | default(lookup('env', 'USER'))) in hardening_ssh_allow_users
        or hardening_in_container
    fail_msg: >-
      ansible_user '{{ ansible_user | default('?') }}' is not in hardening_ssh_allow_users
      {{ hardening_ssh_allow_users }} - applying this would lock you out.
    quiet: true

- name: Install openssh-server and firewalld
  ansible.builtin.dnf:
    name:
      - openssh-server
      - firewalld
    state: present

- name: Deploy sshd hardening drop-in
  ansible.builtin.template:
    src: 01-homelab.conf.j2
    dest: /etc/ssh/sshd_config.d/01-homelab.conf
    owner: root
    group: root
    mode: "0600"
  notify: Validate and reload sshd

- name: Enable and start sshd
  ansible.builtin.systemd_service:
    name: sshd
    enabled: true
    state: started
  when: not hardening_in_container

# ---- firewalld enabled ----
- name: Configure firewalld (enabled)
  when:
    - hardening_firewalld_enabled | bool
    - not hardening_in_container
  block:
    - name: Unmask, enable and start firewalld
      ansible.builtin.systemd_service:
        name: firewalld
        masked: false
        enabled: true
        state: started

    - name: Open required firewalld services
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ hardening_firewalld_services_open }}"

    - name: Close unwanted firewalld services
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: disabled
      loop: "{{ hardening_firewalld_services_closed }}"

# ---- firewalld disabled (RKE2 nodes) ----
- name: Stop, disable and mask firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: stopped
    enabled: false
    masked: true
  when:
    - not (hardening_firewalld_enabled | bool)
    - not hardening_in_container
