---
# Check the full sshd config before reloading, so a bad drop-in can't cut off SSH.
- name: Validate and reload sshd
  ansible.builtin.command: sshd -t
  changed_when: false
  when: not hardening_in_container
  notify: Reload sshd

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: sshd
    state: reloaded
  when: not hardening_in_container
