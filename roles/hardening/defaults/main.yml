---
# Users allowed to log in over SSH. Must include the account Ansible connects as.
hardening_ssh_allow_users:
  - sasa

hardening_ssh_max_auth_tries: 3

# true  = firewalld running with only the services below open
# false = firewalld stopped, disabled and masked (required on RKE2 nodes with Canal)
hardening_firewalld_enabled: true

# Used only when hardening_firewalld_enabled is true
hardening_firewalld_services_open:
  - ssh
hardening_firewalld_services_closed:
  - cockpit
  - dhcpv6-client

hardening_in_container: "{{ ansible_facts['virtualization_type'] | default('') in ['docker', 'podman', 'container', 'containerd'] }}"
