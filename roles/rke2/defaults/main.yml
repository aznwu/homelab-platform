---
# Pinned release (override in inventory/group_vars/rke2_servers.yml)
rke2_version: v1.35.10+rke2r1

# Derived values - normally leave alone
rke2_minor: "{{ rke2_version | regex_replace('^v?(\\d+\\.\\d+)\\..*$', '\\1') }}"
rke2_rpm_version: "{{ rke2_version | regex_replace('^v', '') | replace('+', '~') }}"
rke2_el_major: "{{ ansible_facts['distribution_major_version'] }}"
rke2_rpm_base: https://rpm.rancher.io/rke2/latest
rke2_gpg_key: https://rpm.rancher.io/public.key

# Server config (/etc/rancher/rke2/config.yaml)
rke2_profile: cis
rke2_selinux: true
rke2_node_ip: "{{ ansible_host }}"
rke2_tls_san:
  - "{{ ansible_host }}"
  - "{{ inventory_hostname }}"

# Ingress controller(s). The first entry becomes the default IngressClass.
# ingress-nginx is retired upstream; Traefik is RKE2's default from v1.36.
rke2_ingress_controllers:
  - traefik

# Metrics for Prometheus
rke2_etcd_expose_metrics: true    # etcd metrics on <node-ip>:2381 (read-only, plain HTTP)
rke2_kube_proxy_metrics: true     # kube-proxy metrics on <node-ip>:10249
# Controller-manager / scheduler metrics need bind-address=0.0.0.0, which FAILS
# CIS checks 1.3.7 and 1.4.2. Off by default to stay CIS-compliant.
rke2_expose_control_plane_metrics: false

# Kubeconfig copied to the admin workstation
rke2_fetch_kubeconfig: true
rke2_kubeconfig_local: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/homelab.yaml"
rke2_kubeconfig_name: homelab

# How long to wait for the node to become Ready after start (seconds = retries x delay)
rke2_ready_retries: 60
rke2_ready_delay: 10
