---
- name: Reload NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: reloaded

- name: Restart systemd-sysctl
  ansible.builtin.systemd_service:
    name: systemd-sysctl
    state: restarted

# Only restart on config changes to an already-running server; on first install the
# "Enable and start" task does the start, so there is no double start.
- name: Restart rke2-server
  ansible.builtin.systemd_service:
    name: rke2-server
    state: restarted
  when: rke2_server_was_running | bool
