---
- name: Check this is a Rocky/RHEL 9 family host
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'RedHat'
      - ansible_facts['distribution_major_version'] == '9'
    fail_msg: "base role supports EL9 only (found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }})"
    quiet: true

- name: Install base packages
  ansible.builtin.dnf:
    name: "{{ base_packages }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"
  when: not base_in_container

- name: Enable and start chronyd
  ansible.builtin.systemd_service:
    name: chronyd
    enabled: true
    state: started
  when: not base_in_container

- name: Keep SELinux enforcing
  ansible.posix.selinux:
    policy: targeted
    state: enforcing
  when: not base_in_container

# Kubernetes (kubelet) refuses to run with swap on.
- name: Remove swap entries from /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^[^#]\S*\s+\S+\s+swap\s'
    state: absent
    backup: true

- name: Turn off any active swap
  ansible.builtin.command: swapoff -a
  when:
    - not base_in_container
    - ansible_facts['swaptotal_mb'] | int > 0
  changed_when: true
